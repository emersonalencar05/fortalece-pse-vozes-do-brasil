name: Importar respostas do Google Sheets
on:
  schedule:
    - cron: '7,27,47 * * * *'  # a cada 20 minutos (UTC), horários podem atrasar
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: importar-sheets-pse
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter arquivos do projeto
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ler planilha e importar perfis pendentes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sincronizar-sheets.mjs
