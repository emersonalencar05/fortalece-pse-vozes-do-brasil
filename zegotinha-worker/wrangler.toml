name = "fortalece-pse-ze-gotinha"
main = "worker.js"
compatibility_date = "2026-10-31"

[vars]
# Origem real do GitHub Pages; não inclua /fortalece-pse-vozes-do-brasil
ALLOWED_ORIGINS = "https://emersonalencar05.github.io"
OPENAI_MODEL = "gpt-4.1-mini"

# Limites APROXIMADOS por minuto e localização Cloudflare.
[[ratelimits]]
name = "VISITOR_LIMITER"
namespace_id = "41351"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "41352"
[ratelimits.simple]
limit = 150
period = 60
